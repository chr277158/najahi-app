<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - نَجَاحِي</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🌟 نَجَاحِي 🌟</h1>
            <p>منصة تعليمية تفاعلية</p>
        </header>

        <div class="card">
            <h2>📝 إنشاء حساب جديد</h2>
            <p>أنشئ حسابك للبدء في التعلم</p>

            <form id="registerForm">
                <div class="form-group">
                    <label for="fullName">👤 الاسم الكامل</label>
                    <input type="text" id="fullName" placeholder="أدخل اسمك الكامل" required>
                </div>

                <div class="form-group">
                    <label for="username">📧 اسم المستخدم</label>
                    <input type="text" id="username" placeholder="اختر اسم مستخدم" required minlength="3">
                </div>

                <div class="form-group">
                    <label for="password">🔑 كلمة المرور</label>
                    <input type="password" id="password" placeholder="اختر كلمة مرور" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">🔑 تأكيد كلمة المرور</label>
                    <input type="password" id="confirmPassword" placeholder="أعد كتابة كلمة المرور" required>
                </div>

                <div class="form-group">
                    <label for="level">📚 المستوى الدراسي</label>
                    <select id="level" required>
                        <option value="">-- اختر مستواك --</option>
                        <option value="3">السنة الثالثة ابتدائي</option>
                        <option value="5">السنة الخامسة ابتدائي</option>
                    </select>
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>

                <button type="submit" class="btn-primary">
                    ✨ إنشاء الحساب
                </button>
            </form>

            <div class="form-footer">
                <p>لديك حساب بالفعل؟ <a href="/login.html">تسجيل الدخول</a></p>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const level = document.getElementById('level').value;
            const errorMessage = document.getElementById('errorMessage');

            // إخفاء رسالة الخطأ
            errorMessage.style.display = 'none';

            // التحقق من تطابق كلمات المرور
            if (password !== confirmPassword) {
                errorMessage.textContent = 'كلمتا المرور غير متطابقتين';
                errorMessage.style.display = 'block';
                return;
            }

            // إنشاء الحساب
            const result = await Auth.register(username, password, fullName, parseInt(level));

            if (result.success) {
                // الانتقال إلى لوحة التحكم
                window.location.href = '/dashboard.html';
            } else {
                // عرض رسالة الخطأ
                errorMessage.textContent = result.message;
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
