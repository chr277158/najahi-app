<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - نَجَاحِي</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🌟 نَجَاحِي 🌟</h1>
            <p>منصة تعليمية تفاعلية</p>
        </header>

        <div class="card">
            <h2>📝 إنشاء حساب جديد</h2>
            <p>أنشئ حسابك للبدء في التعلم</p>

            <form id="registerForm">
                <div class="form-group">
                    <label for="fullName"> الاسم الكامل</label>
                    <input type="text" id="fullName" placeholder="أدخل اسمك الكامل" required>
                </div>

                <div class="form-group">
                    <label for="username">📧 اسم المستخدم</label>
                    <input type="text" id="username" placeholder="اختر اسم مستخدم" required minlength="3">
                </div>

                <div class="form-group">
                    <label for="password"> كلمة المرور</label>
                    <input type="password" id="password" placeholder="اختر كلمة مرور" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">🔑 تأكيد كلمة المرور</label>
                    <input type="password" id="confirmPassword" placeholder="أعد كتابة كلمة المرور" required>
                </div>
                <div class="form-group">
    <label for="gender"> الجنس</label>
    <select id="gender" required>
        <option value="">-- اختر --</option>
        <option value="male">ذكر</option>
        <option value="female">أنثى</option>
    </select>
</div>
                <div class="form-group">
                    <label for="level">📚 المستوى الدراسي</label>
                    <select id="level" required>
                        <option value="">-- اختر مستواك --</option>
                        <option value="3">السنة الثالثة ابتدائي</option>
                        <option value="5">السنة الخامسة ابتدائي</option>
                    </select>
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <div id="successMessage" class="success-message" style="display: none;"></div>

                <button type="submit" class="btn-primary" id="submitBtn">
                    ✨ إنشاء الحساب
                </button>
            </form>

            <div class="form-footer">
                <p>لديك حساب بالفعل؟ <a href="/login.html">تسجيل الدخول</a></p>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        console.log('✅ register.html loaded successfully');
        
        // التحقق من وجود تسجيل دخول سابق
        if (Auth && Auth.isLoggedIn()) {
            console.log('🔍 User already logged in, redirecting...');
            Auth.verify().then(isValid => {
                if (isValid) {
                    window.location.href = '/dashboard.html';
                }
            });
        }

        // معالجة نموذج التسجيل
        const registerForm = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        console.log('🔗 Form element found:', registerForm);
        console.log('🔗 Submit button found:', submitBtn);

        if (registerForm) {
            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                console.log('📝 Form submitted!');

                const fullName = document.getElementById('fullName').value;
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const level = document.getElementById('level').value;

                console.log('📋 Form data:', { fullName, username, level });

                // إخفاء الرسائل
                errorMessage.style.display = 'none';
                successMessage.style.display = 'none';

                // التحقق من تطابق كلمات المرور
                if (password !== confirmPassword) {
                    errorMessage.textContent = '❌ كلمتا المرور غير متطابقتين';
                    errorMessage.style.display = 'block';
                    return;
                }

                // تعطيل الزر أثناء الإرسال
                submitBtn.disabled = true;
                submitBtn.textContent = '⏳ جاري إنشاء الحساب...';

                try {
                    console.log('🚀 Calling Auth.register...');
                    const gender = document.getElementById('gender').value;

                    const result = await Auth.register(username, password, fullName, parseInt(level), gender);
                    console.log('📥 Register result:', result);

                    if (result.success) {
                        successMessage.textContent = '✅ تم إنشاء الحساب بنجاح! جاري التحويل...';
                        successMessage.style.display = 'block';
                        
                        // الانتظار ثانية ثم التحويل
                        setTimeout(() => {
                            window.location.href = '/dashboard.html';
                        }, 1000);
                    } else {
                        errorMessage.textContent = '❌ ' + result.message;
                        errorMessage.style.display = 'block';
                        submitBtn.disabled = false;
                        submitBtn.textContent = '✨ إنشاء الحساب';
                    }
                } catch (error) {
                    console.error('❌ Registration error:', error);
                    errorMessage.textContent = '❌ حدث خطأ غير متوقع: ' + error.message;
                    errorMessage.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = '✨ إنشاء الحساب';
                }
            });
        } else {
            console.error('❌ Form element not found!');
        }
    </script>
</body>
</html>
