<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امتحان الرياضيات - السنة الثالثة ابتدائي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4A90E2;
            --success-color: #2ECC71;
            --warning-color: #F39C12;
            --bg-color: #F0F8FF;
            --card-bg: #FFFFFF;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .quiz-container {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            text-align: center;
        }
        .progress-bar {
            width: 100%;
            height: 15px;
            background-color: #E0E0E0;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.5s ease;
        }
        .question-text {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 25px;
            font-weight: 700;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #E8F4FD;
            border: 2px solid var(--primary-color);
            border-radius: 15px;
            padding: 15px;
            font-size: 1.2rem;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #333;
        }
        .option-btn:hover {
            background-color: var(--primary-color);
            color: white;
            transform: translateY(-3px);
        }
        .option-btn.correct {
            background-color: var(--success-color) !important;
            border-color: var(--success-color) !important;
            color: white !important;
        }
        .option-btn.wrong {
            background-color: var(--warning-color) !important;
            border-color: var(--warning-color) !important;
            color: white !important;
        }
        .feedback-msg {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 30px;
        }
        .next-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            margin-top: 20px;
            display: none; /* مخفي حتى يتم اختيار إجابة */
        }
        .next-btn:hover {
            background-color: #357ABD;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    <div id="quiz-content">
        <div class="question-text" id="questionText">جاري تحميل السؤال...</div>
        <div class="options-grid" id="optionsGrid"></div>
        <div class="feedback-msg" id="feedbackMsg"></div>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">السؤال التالي ⬅️</button>
    </div>
    <div id="result-screen" style="display: none;">
        <h2 id="final-score"></h2>
        <p id="final-message"></p>
        <button class="next-btn" style="display: inline-block;" onclick="location.reload()">إعادة الامتحان 🔄</button>
    </div>
</div>

<script>
    // بيانات الأسئلة (مستوحاة من ملفات الامتحانات المرفقة)
    const questions = [
        {
            question: "كم يساوي 5 × 6 ؟",
            options: ["30", "25", "35", "40"],
            correct: 0
        },
        {
            question: "أحمد لديه 15 دينارا، اشترى كتاباً بـ 7 دنانير. كم تبقى معه؟",
            options: ["7 دنانير", "8 دنانير", "9 دنانير", "22 دينارا"],
            correct: 1
        },
        {
            question: "ما هو الشكل الهندسي الذي له 3 أضلاع؟",
            options: ["مربع", "دائرة", "مثلث", "مستطيل"],
            correct: 2
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    function loadQuestion() {
        answered = false;
        const q = questions[currentQuestionIndex];
        document.getElementById('questionText').innerText = `السؤال ${currentQuestionIndex + 1}: ${q.question}`;
        document.getElementById('feedbackMsg').innerText = "";
        document.getElementById('nextBtn').style.display = "none";
        
        // تحديث شريط التقدم
        const progress = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById('progressFill').style.width = `${progress}%`;

        const optionsGrid = document.getElementById('optionsGrid');
        optionsGrid.innerHTML = "";
        
        q.options.forEach((option, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = option;
            btn.onclick = () => checkAnswer(index, btn);
            optionsGrid.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex, btnElement) {
        if (answered) return; // منع النقر المتعدد
        answered = true;
        
        const correctIndex = questions[currentQuestionIndex].correct;
        const buttons = document.querySelectorAll('.option-btn');
        const feedback = document.getElementById('feedbackMsg');

        if (selectedIndex === correctIndex) {
            btnElement.classList.add('correct');
            feedback.innerText = "أحسنت! إجابة صحيحة 🌟";
            feedback.style.color = "var(--success-color)";
            score++;
        } else {
            btnElement.classList.add('wrong');
            buttons[correctIndex].classList.add('correct'); // إظهار الإجابة الصحيحة
            feedback.innerText = "لا بأس، حاول في السؤال القادم! 💪";
            feedback.style.color = "var(--warning-color)";
        }

        document.getElementById('nextBtn').style.display = "inline-block";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-content').style.display = "none";
        document.getElementById('result-screen').style.display = "block";
        document.getElementById('progressFill').style.width = "100%";
        
        const finalScoreEl = document.getElementById('final-score');
        const finalMsgEl = document.getElementById('final-message');
        
        finalScoreEl.innerText = `نتيجتك: ${score} من ${questions.length}`;
        
        if (score === questions.length) {
            finalMsgEl.innerText = "ممتاز! أنت بطل الرياضيات بلا منازع! 🏆";
        } else if (score >= questions.length / 2) {
            finalMsgEl.innerText = "أحسنت! نتيجة جيدة، يمكنك أن تكون أفضل في المرة القادمة! 👍";
        } else {
            finalMsgEl.innerText = "لا تيأس! التدريب المستمر سيجعلك أفضل، حاول مجدداً! 🌱";
        }
    }

    // بدء الامتحان
    loadQuestion();
</script>

</body>
</html>
